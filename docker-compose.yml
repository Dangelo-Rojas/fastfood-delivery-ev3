version: '3.8'

services:

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    networks:
      - network-fastfood
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 20

  eureka-server:
      build: ./eureka-server/eureka-server
      container_name: eureka-server
      ports:
        - "8761:8761"
      networks:
        - network-fastfood
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
        interval: 15s
        timeout: 5s
        retries: 10
        start_period: 30s

  api-gateway:
      build: ./api-gateway/api-gateway
      container_name: api-gateway
      ports:
        - "8080:8080"
      environment:
        EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
        SPRING_PROFILES_ACTIVE: dev
      networks:
        - network-fastfood
      depends_on:
        eureka-server:
          condition: service_healthy

  ms-usuario:
      build: ./ms-usuario/ms-usuario
      container_name: ms-usuario
      environment:
        SPRING_PROFILES_ACTIVE: dev
        EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
        DATABASE_HOST: mysql-db
        GATEWAY_URL: http://api-gateway:8080
      networks:
        - network-fastfood
      depends_on:
        mysql-db:
          condition: service_healthy
        eureka-server:
          condition: service_healthy

  ms-restaurante:
      build: ./ms-restaurante/ms-restaurante
      container_name: ms-restaurante
      environment:
        SPRING_PROFILES_ACTIVE: dev
        EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
        DATABASE_HOST: mysql-db
        GATEWAY_URL: http://api-gateway:8080
      networks:
        - network-fastfood
      depends_on:
        mysql-db:
          condition: service_healthy
        eureka-server:
          condition: service_healthy

  ms-orden:
      build: ./ms-orden/ms-orden
      container_name: ms-orden
      environment:
        SPRING_PROFILES_ACTIVE: dev
        EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
        DATABASE_HOST: mysql-db
        GATEWAY_URL: http://api-gateway:8080
        MS_RESTAURANTE_URL: http://ms-restaurante:8082
      networks:
        - network-fastfood
      depends_on:
        mysql-db:
          condition: service_healthy
        eureka-server:
          condition: service_healthy
        ms-restaurante:                                    
          condition: service_started   

  ms-delivery:
      build: ./ms-delivery/ms-delivery
      container_name: ms-delivery
      environment:
        SPRING_PROFILES_ACTIVE: dev
        EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
        DATABASE_HOST: mysql-db
        GATEWAY_URL: http://api-gateway:8080
      networks:
        - network-fastfood
      depends_on:
        mysql-db:
          condition: service_healthy
        eureka-server:
          condition: service_healthy
        
networks:
  network-fastfood:
    driver: bridge